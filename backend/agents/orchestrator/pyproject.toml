[project]
name = "orchestrator"
version = "1.0.0"
description = "Orchestrator Agent"
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.30.0",
    "boto3>=1.40.0",
    "botocore>=1.40.0",
    "bedrock-agentcore>=1.1.1",
    "PyJWT>=2.10.0",
    "shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


[tool.uv.sources]
"shared" = { path = "../../shared", editable = true }
